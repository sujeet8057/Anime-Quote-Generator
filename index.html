<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Words of Wisdom</h1>
        <div class="quote-card">
            <p id="set">Click the button below to discover timeless wisdom that will inspire your journey ✨</p>
            <div class="quote-author" id="author"></div>
        </div>
        <button class="generate-btn" id="load">Generate New Quote</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
